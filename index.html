<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>中醫自學</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --surface: #16213e;
        --card: #0f3460;
        --accent: #e94560;
        --text: #eaeaea;
        --muted: #a0a0b0;
        --green: #4caf50;
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding-bottom: 70px;
        font-size: 15px;
        line-height: 1.6;
      }
      .tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        background: var(--surface);
        border-top: 1px solid #2a2a4a;
        z-index: 100;
      }
      .tab-bar button {
        flex: 1;
        padding: 10px 4px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .tab-bar button.active {
        color: var(--accent);
      }
      .tab-bar button span.icon {
        font-size: 18px;
      }
      .page {
        display: none;
        padding: 16px;
        max-width: 600px;
        margin: 0 auto;
      }
      .page.active {
        display: block;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 12px;
        color: var(--accent);
      }
      h2 {
        font-size: 17px;
        margin: 16px 0 8px;
        color: var(--text);
      }
      h3 {
        font-size: 15px;
        margin: 12px 0 6px;
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 10px;
      }
      .badge {
        display: inline-block;
        background: var(--surface);
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 12px;
        margin-right: 4px;
        color: var(--muted);
      }
      .btn {
        display: inline-block;
        padding: 8px 16px;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-size: 14px;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--accent);
        color: var(--accent);
      }
      .btn-green {
        background: var(--green);
      }
      .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
      }
      input[type="text"],
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #2a2a4a;
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        margin-bottom: 10px;
      }
      select {
        appearance: none;
        -webkit-appearance: none;
      }
      .flex {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .flex-wrap {
        flex-wrap: wrap;
      }
      .mt {
        margin-top: 12px;
      }
      .mb {
        margin-bottom: 12px;
      }
      .text-center {
        text-align: center;
      }
      .text-muted {
        color: var(--muted);
      }
      .text-sm {
        font-size: 12px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .flashcard {
        background: var(--card);
        border-radius: var(--radius);
        padding: 24px;
        text-align: center;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        perspective: 1000px;
      }
      .flashcard .front {
        font-size: 22px;
        font-weight: bold;
      }
      .flashcard .back {
        font-size: 14px;
        text-align: left;
        margin-top: 12px;
        line-height: 1.8;
      }
      .flashcard .back dt {
        color: var(--accent);
        font-weight: bold;
        margin-top: 8px;
      }
      .flashcard .back dd {
        margin-left: 0;
      }
      .nav-controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 16px;
      }
      .progress-bar {
        height: 4px;
        background: var(--surface);
        border-radius: 2px;
        overflow: hidden;
        margin: 4px 0;
      }
      .progress-bar > div {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s;
      }
      .stage-card {
        border-left: 3px solid var(--accent);
        padding-left: 12px;
        margin-bottom: 16px;
      }
      .quiz-option {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px;
        margin: 6px 0;
        border-radius: var(--radius);
        border: 1px solid #2a2a4a;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
      }
      .quiz-option.correct {
        border-color: var(--green);
        background: rgba(76, 175, 80, 0.15);
      }
      .quiz-option.wrong {
        border-color: var(--accent);
        background: rgba(233, 69, 96, 0.15);
      }
      .quiz-option:disabled {
        opacity: 0.7;
      }
      .search-results {
        max-height: 60vh;
        overflow-y: auto;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="tab-bar">

      <h1>查詢工具書</h1>
      <div id="ref-content"></div>
    </div>
    <div id="page-quiz" class="page">
      <h1>測驗考試</h1>
      <div id="quiz-content"></div>
    </div>

    <script>
      window.TCM_DATA={"curriculum": {"stages": [{"id": "s1", "title": "階段一｜中醫基礎理論（上）", "goal": "建立陰陽五行與藏象氣血的思維框架——這是所有後續內容的「語法」。", "howto": "先讀卡片搞懂定義，再用測驗檢測；陰陽五行要能不假思索說出對應表（五色/五味/五臟/五季）。", "duration": "2–3 週", "tasks": [{"label": "陰陽學說：定義、相互關係、臨牀套用", "module": "theory", "filter": "陰陽"}, {"label": "五行學說：生剋乘侮、五臟對應表", "module": "theory", "filter": "五行"}, {"label": "藏象：五臟六腑功能與相互關係", "module": "theory", "filter": "藏象"}, {"label": "氣血津液：生成、運行、功能", "module": "theory", "filter": "氣血津液"}], "milestone": "能默寫五行歸屬對應表，並用陰陽解釋一個日常病理例子（如潮熱盜汗）。"}, {"id": "s2", "title": "階段二｜中醫基礎理論（下）：經絡・病因・治則", "goal": "掌握經絡系統輪廓與發病邏輯，學會「為什麼这样治」。", "howto": "經絡部分搭配穴位模組先認十四經名稱與走向；病因治則重在理解案例。", "duration": "2 週", "tasks": [{"label": "經絡：十二經脈走向、任督二脈", "module": "theory", "filter": "經絡"}, {"label": "病因：六淫、七情、飲食勞倦", "module": "theory", "filter": "病因"}, {"label": "治則治法：八法、標本緩急、三因制宜", "module": "theory", "filter": "治則治法"}, {"label": "十四經總覽（穴位模組的經絡頁）", "module": "acupoints", "filter": ""}], "milestone": "能背出十二經脈流注順序與陰陽表裡配對。"}, {"id": "s3", "title": "階段三｜中藥學", "goal": "掌握 ~100 味常用藥的性味歸經與功效，建立「以類記藥」的骨架。", "howto": "按章節（牌組）逐類背：先記每類代表藥，再記類內對比（如麻黃與桂枝）。每日新藥 5–8 味，間隔重複。", "duration": "4–6 週", "tasks": [{"label": "解表藥・清熱藥", "module": "herbs", "filter": "解表藥"}, {"label": "補虛藥・溫裡藥", "module": "herbs", "filter": "補虛藥"}, {"label": "理氣・活血・止血藥", "module": "herbs", "filter": "理氣藥"}, {"label": "化痰止咳・安神・平肝息風藥", "module": "herbs", "filter": "化痰止咳平喘藥"}, {"label": "其餘章節收尾（瀉下/祛風濕/化濕/利水/消食/開竅/收澀）", "module": "herbs", "filter": "瀉下藥"}], "milestone": "隨機抽 20 味藥能說出性味、歸經、功效與使用注意。"}, {"id": "s4", "title": "階段四｜方劑學", "goal": "背熟 ~60 首代表方：組成（君臣佐使）、功用、主治、歌訣。", "howto": "每首方先背歌訣，再拆方義；同類方對比記（四君子湯與六君子湯與香砂六君子湯）。", "duration": "4–6 週", "tasks": [{"label": "解表劑・清熱劑", "module": "formulas", "filter": "解表劑"}, {"label": "補益劑（四君/四物/六味/生脈系列）", "module": "formulas", "filter": "補益劑"}, {"label": "理血・化痰止咳・安神劑", "module": "formulas", "filter": "理血劑"}, {"label": "其餘章節（瀉下/祛風濕/開竅/消食/固澀/平肝息風）", "module": "formulas", "filter": "瀉下劑"}], "milestone": "看到證型（如脾胃氣虛）能立刻寫出代表方與君臣佐使。"}, {"id": "s5", "title": "階段五｜經絡穴位", "goal": "掌握十四經 ~120 個重點穴的定位、主治與特殊穴性。", "howto": "按經背穴：每經先記走向與總數，再記特定穴（五輸/募/會/四總穴）；配合自身體表定位。", "duration": "3–4 週", "tasks": [{"label": "任督二脈（要穴最密集，優先）", "module": "acupoints", "filter": "m13"}, {"label": "足陽明胃經（足三里為首）", "module": "acupoints", "filter": "m07"}, {"label": "手三陰三陽（心肺脾胃相表裡）", "module": "acupoints", "filter": "m01"}, {"label": "足三陰三陽・督脈收尾", "module": "acupoints", "filter": "m10"}], "milestone": "能口述 30 個常用穴的正確定位（骨度分寸）與主治。"}, {"id": "s6", "title": "階段六｜整合與測驗", "goal": "跨模組混合測驗，查漏補缺，把知識變成可提取的長期記憶。", "howto": "每輪 20–40 題混合測驗；錯題回到卡片模組重背；每週重測一次上週錯題。", "duration": "持續", "tasks": [{"label": "混合測驗：理論 + 中藥 + 方劑 + 穴位", "module": "quiz", "filter": ""}, {"label": "錯題回收（卡片模組標記「不記得」的卡）", "module": "herbs", "filter": ""}], "milestone": "混合測驗穩定 85 分以上。"}]}, "theory": {"concepts": [{"id": "t001", "term": "陰陽學說", "category": "陰陽", "definition": "研究陰陽基本概念及其相互關係的學說，是中醫學的理論核心。宇宙萬物皆內含對立統一的两个方面，以陰陽概括之。", "keyPoints": ["陰陽是對宇宙事物相互對立兩方面的概括", "屬性：運動、外向、上升、温热、明亮為陽；靜止、內守、下降、寒冷、晦暗為陰", "陰陽學說用於說明人體結構、生理、病理及指導診斷治療"]}, {"id": "t002", "term": "陰陽對立制約", "category": "陰陽", "definition": "陰陽雙方屬性相反，相互抑制、相互約束。如機能（陽）與物質（陰）之間的相互制約，維持動態平衡。", "keyPoints": ["陰勝則陽病，陽勝則陰病", "陰勝則寒，陽勝則熱", "制約失調則出現陰陽偏盛偏衰的病理狀態"]}, {"id": "t003", "term": "陰陽互根互用", "category": "陰陽", "definition": "陰陽雙方各以對方為自己存在的前提，並相互促進、相互資生。如氣（陽）與血（陰）：氣能生血行血，血能載氣養氣。", "keyPoints": ["孤陰不生，獨陽不長", "陰為陽之守，陽為陰之使", "互根關係破壞則出現「陰竭」「陽脫」的危候"]}, {"id": "t004", "term": "陰陽消長平衡", "category": "陰陽", "definition": "陰陽雙方處於動態的增減變化之中，此消彼長、此長彼消，維持相對平衡。消長是陰陽運動的基本形式。", "keyPoints": ["陰長則陽消，陽長則陰消", "生理狀態：陰平陽秘，精神乃治", "病理狀態：陰陽消長失調，則疾病發生"]}, {"id": "t005", "term": "陰陽轉化", "category": "陰陽", "definition": "陰陽雙方在一定的條件下，各自向著其相反的方向轉化。陰可以轉陽，陽可以轉陰。", "keyPoints": ["重陰必陽，重陽必陰", "寒極生熱，熱極生寒", "轉化是消長變化的量變達到質變的結果"]}, {"id": "t006", "term": "陰虛則熱", "category": "陰陽", "definition": "陰液虧損，陰不制陽，陽相對偏亢而出現虛熱證。表現為潮熱、盜汗、五心煩熱、舌紅少苔、脈細數。", "keyPoints": ["屬虛熱證，非陽氣過盛", "治法：滋陰制陽（陽病治陰、壯水之主以制陽光）", "代表表現：潮熱盜汗、五心煩熱"]}, {"id": "t007", "term": "陽虛則寒", "category": "陰陽", "definition": "陽氣虧虛，陽不制陰，陰相對偏盛而出現虛寒證。表現為畏寒肢冷、面色㿠白、小便清長、脈沉遲無力。", "keyPoints": ["屬虛寒證，非陰氣過盛", "治法：補陽制陰（陰病治陽、益火之源以消陰翳）", "與陰盛則寒（實寒證）的鉴别：一虛一實"]}, {"id": "t008", "term": "五行學說", "category": "五行", "definition": "以木、火、土、金、水五行的特性及生剋制化關係，說明事物屬性及其相互联系的學說。中醫學以此歸類人體臟腑組織並說明其相互關係。", "keyPoints": ["五行特性：木曰曲直、火曰炎上、土爰稼穡、金曰從革、水曰潤下", "五臟配五行：肝木、心火、脾土、肺金、腎水", "生剋制化維持整體協調平衡"]}, {"id": "t009", "term": "木曰曲直", "category": "五行", "definition": "木的特性是能屈能伸，代表生長、升發、條達。凡具有此類特性的事物均属木。", "keyPoints": ["生長、升發、條達", "肝屬木：肝喜條達而惡抑鬱", "對應春、東、風、青、酸"]}, {"id": "t010", "term": "火曰炎上", "category": "五行", "definition": "火的特性是溫熱、上升。凡具有溫熱、升騰作用的事物均属火。", "keyPoints": ["溫熱、升騰", "心屬火：心陽溫煦全身", "對應夏、南、熱、赤、苦"]}, {"id": "t011", "term": "土爰稼穡", "category": "五行", "definition": "土有播種和收穫農作物的特性，引申為受納、生化、承載。凡具有生化、承載、受納作用的事物均属土。", "keyPoints": ["生化、承載、受納", "脾屬土：為後天之本、氣血生化之源", "土為五行之中，對應長夏、中央、黃、甘"]}, {"id": "t012", "term": "金曰從革", "category": "五行", "definition": "從革指金屬可變更形制而從人之意，引申為清肅、肅殺、收斂。凡具有清肅、收殺、肅降特性的事物均属金。", "keyPoints": ["清肅、肅降、收斂", "肺屬金：肺主肅降、清肅", "對應秋、西、燥、白、辛"]}, {"id": "t013", "term": "水曰潤下", "category": "五行", "definition": "水具有滋潤、向下、閉藏的特性。凡具有寒涼、滋潤、下行作用的事物均属水。", "keyPoints": ["寒涼、滋潤、下行、閉藏", "腎屬水：腎主藏精、主水", "對應冬、北、寒、黑、鹹"]}, {"id": "t014", "term": "五行相生", "category": "五行", "definition": "五行之間有序的資生、助長關係：木生火、火生土、土生金、金生水、水生木。生我者為母，我生者為子。", "keyPoints": ["次序：木→火→土→金→水→木", "母子關係：生我為母、我生為子", "病理傳變：母病及子（腎病及肝）、子病犯母（肝病及腎）"]}, {"id": "t015", "term": "五行相剋", "category": "五行", "definition": "五行之間有序的克制、制約關係：木剋土、土剋水、水剋火、火剋金、金剋木。克我者為所不勝，我克者為所勝。", "keyPoints": ["次序：木→土→水→火→金→木", "所勝與所不勝：我克者為所勝，克我者為所不勝", "相剋是生理性的制約，維持平衡"]}, {"id": "t016", "term": "五行乘侮", "category": "五行", "definition": "五行乘侮是相剋關係異常的病理表現。相乘是克制太過（過強克過弱或本身過強），相侮是反向克制（恃強凌弱，反克其「所不勝」）。", "keyPoints": ["相乘：次序與相剋一致，但力量異常（木旺乘土）", "相侮：次序與相剋相反（木火刑金，木反侮金）", "「氣盛則侮所不勝，氣衰則為己所勝者侮也」"]}, {"id": "t017", "term": "五行制化", "category": "五行", "definition": "相生與相剋結合，生中有剋、剋中有生，調節維持整體平衡的機制。如木生火、火生土、土生金、金剋木，形成自我調節。", "keyPoints": ["制則化，化則生，生而不已，為萬物之母", "有制化才有事物的穩定與發展", "制化失調則乘侮病變發生"]}, {"id": "t018", "term": "臟象", "category": "藏象", "definition": "內臟生理病理表現於外的徵象，也指研究臟腑臟象的學說。通過體外的徵象推測內在臟腑變化，稱「司外揣內」。", "keyPoints": ["臟：心、肺、脾、肝、腎（五臟）", "腑：膽、胃、小腸、大腸、膀胱、三焦（六腑）", "臟象的特點是「藏於內而顯於外」"]}, {"id": "t019", "term": "五臟", "category": "藏象", "definition": "心、肺、脾、肝、腎的合稱。功能以「藏精氣」為主，「藏而不瀉」，「滿而不能實」。", "keyPoints": ["五臟主化生和贮藏精氣", "五臟與五體、五官、五華等相聯絡", "病理特点：五臟多虛證"]}, {"id": "t020", "term": "六腑", "category": "藏象", "definition": "膽、胃、小腸、大腸、膀胱、三焦的合稱。功能以「傳化水谷」為主，「瀉而不藏」，「實而不能滿」，以通為用。", "keyPoints": ["六腑主受納、腐熟、傳導、排泄", "六腑以通為用、以降為和", "病理特点：六腑多實證，「六腑以通為補」"]}, {"id": "t021", "term": "奇恆之腑", "category": "藏象", "definition": "腦、髓、骨、脈、膽、女子胞的合稱。形態似腑似臟，功能藏精似臟而不傳化水谷，故既非臟亦非腑。", "keyPoints": ["腦、髓、骨、脈、膽、女子胞", "膽既屬六腑又屬奇恆之腑", "「貯而不寫，故實而不能滿也」"]}, {"id": "t022", "term": "心", "category": "藏象", "definition": "位於胸中，為生命活動的主宰。主血脈、主神志，為五臟六腑之大主，稱「君主之官」。", "keyPoints": ["心為君主之官、五臟六腑之大主", "在體合脈，其華在面，開竅於舌", "在志為喜，在液為汗，在五行屬火，與小腸相表裡"]}, {"id": "t023", "term": "心主血脈", "category": "藏象", "definition": "心氣推動血液在脈中循環運行。心、血、脈三者密切相關，心氣充沛則血脈充盈、運行正常。", "keyPoints": ["心氣推動血液運行", "血液充盈依賴心氣和心陽（心火）的溫煦", "臨床：心氣不足則血行無力，面淡無華、脈虛"]}, {"id": "t024", "term": "心主神志", "category": "藏象", "definition": "心主宰人體的精神、意識、思維活動。心主神志以心血為物質基礎，稱「心者，神明之府也」。", "keyPoints": ["心藏神，主宰精神意識思維", "心血不足則心悸、失眠、多夢、健忘", "心主神志失常可出現神昏、譫語、狂躁"]}, {"id": "t025", "term": "肺", "category": "藏象", "definition": "位於胸中，主氣、司呼吸，主宣發肅降，通調水道，朝百脈、主治節，為「相傅之官」「華蓋」「嬌臟」。", "keyPoints": ["肺為相傅之官，主治節", "肺為華蓋，為嬌臟，不耐寒熱", "在體合皮膚，開竅於鼻，在志為憂（悲），在液為涕"]}, {"id": "t026", "term": "肺主氣司呼吸", "category": "藏象", "definition": "肺主一身之氣，包括主呼吸之氣和主一身之氣（司宗氣生成）。肺通過呼吸運動吐故納新，維持全身氣機。", "keyPoints": ["主呼吸之氣：體内外氣體交換", "主一身之氣：參與宗氣生成，調節全身氣機", "肺氣虛則氣短不足以息、聲音低怯"]}, {"id": "t027", "term": "肺主宣發肅降", "category": "藏象", "definition": "宣發指肺氣向上向外的發散宣散；肅降指肺氣向下肅清、肅降。宣發與肅降相因，維持呼吸、行水、衛外功能。", "keyPoints": ["宣發：呼出濁氣、散精氣、宣發衛氣", "肅降：吸入清氣、通調水道下輸膀胱、肅清肺道", "宣降失調則咳、喘、痰飲、水腫"]}, {"id": "t028", "term": "脾", "category": "藏象", "definition": "位於中焦，主運化、主升清、主統血，為後天之本、氣血生化之源，稱「倉廩之官」。", "keyPoints": ["脾為後天之本、氣血生化之源", "在體合肌肉、主四肢，開竅於口，其華在唇，在志為思，在液為涎", "脾喜燥惡濕，與胃相表裡"]}, {"id": "t029", "term": "脾主運化", "category": "藏象", "definition": "脾具有消化飲食、吸收轉輸水谷精微的生理功能，包括運化水谷和運化水液兩方面。", "keyPoints": ["運化水谷：消化吸收轉輸精微", "運化水液：轉輸排泄水液，防止濕痰飲停聚", "脾失健運則食少腹脹、便溏、痰飲、水腫"]}, {"id": "t030", "term": "脾主升清", "category": "藏象", "definition": "脾氣以升為順，將水谷精微上輸心肺頭目，並維持內臟位置恆定。", "keyPoints": ["升輸精微上奉心肺化生氣血", "升舉內臟，維持位置恆定", "脾氣下陷則腹瀉、脫肛、內臟下垂"]}, {"id": "t031", "term": "脾主統血", "category": "藏象", "definition": "脾氣有統攝控制血液在脈中運行、防止逸出脈外的功能。統血實為氣攝血作用的體現。", "keyPoints": ["氣能攝血的具體體現", "脾不統血則便血、尿血、崩漏、肌衄等慢性出血", "治法：補氣攝血，代表方歸脾湯"]}, {"id": "t032", "term": "肝", "category": "藏象", "definition": "位於右脅，主疏洩、主藏血，主筋、開竅於目，為「將軍之官」，體陰而用陽，肝為剛臟。", "keyPoints": ["肝為將軍之官，主謀慮", "在體合筋，其華在爪，開竅於目，在志為怒，在液為淚", "肝體陰而用陽，喜條達而惡抑鬱"]}, {"id": "t033", "term": "肝主疏洩", "category": "藏象", "definition": "肝氣具有疏通、暢達、升發的全身氣機調節作用。體現在調暢氣機、促進消化、調節情志、促進生殖等方面。", "keyPoints": ["調暢氣機：氣機通暢依賴肝的疏洩", "促進消化：協調脾胃升降、分泌排泄膽汁", "調節情志：疏洩失則情志抑鬱或急躁易怒"]}, {"id": "t034", "term": "肝主藏血", "category": "藏象", "definition": "肝具有貯藏血液、調節血量的功能。人臥血歸於肝，活動時血供外周；肝血不足可見目澀、肢麻、月經量少。", "keyPoints": ["貯血與調節血量", "肝收斂陰血，防止出血", "肝血不足：兩目乾澀、夜盲、筋攣、月經量少或閉經"]}, {"id": "t035", "term": "腎", "category": "藏象", "definition": "位於腰裡，藏精、主水、主納氣，主骨生髓通於腦，為先天之本、陰陽之根，稱「作強之官」。", "keyPoints": ["腎為先天之本，五臟陰陽之根", "在體主骨、生髓、通於腦，其華在髮，開竅於耳及二陰", "在志為恐，在液為唾"]}, {"id": "t036", "term": "腎藏精", "category": "藏象", "definition": "腎貯藏先天之精與後天之精，主生長、發育與生殖。腎精化氣，腎陰腎陽為各臟陰陽之本。", "keyPoints": ["精：先天之精稟受於父母，後天之精源於脾胃", "腎精化腎氣，分腎陰腎陽，為五臟陰陽之本", "腎精不足：小兒生長遲緩、成人早衰、不孕不育"]}, {"id": "t037", "term": "胃", "category": "藏象", "definition": "位於中焦，主受納腐熟水谷，主通降，以和降為順，為「水谷之海」「倉廩之官」（與脾合稱後天之本）。", "keyPoints": ["胃主受納腐熟：接受容納初步消化飲食", "胃氣主降，降則和、降則通", "胃氣為後天之本的象徵：「有胃氣則生，無胃氣則死」"]}, {"id": "t038", "term": "氣", "category": "氣血津液", "definition": "氣是人體中最基本的精微物質，也是人體功能活動的統稱。氣運行全身，推動、溫煦、防禦、固攝、氣化。", "keyPoints": ["氣是活力很強的精微物質", "五大功能：推動、溫煦、防禦、固攝、氣化", "氣的來源：先天精氣＋水谷精氣＋自然清氣"]}, {"id": "t039", "term": "元氣", "category": "氣血津液", "definition": "元氣（原氣）由腎中先天之精化生，以三焦為通道流行全身，是人體生命活動的原動力。", "keyPoints": ["根於腎，以三焦為通道", "推動人體生長發育與各臟腑功能", "元氣虛損則生長遲緩、早衰、臟腑功能低下"]}, {"id": "t040", "term": "宗氣", "category": "氣血津液", "definition": "宗氣由肺吸入的清氣與脾胃水谷精氣結合生於胸中，走息道以行呼吸、貫心脈以行氣血。", "keyPoints": ["積於胸中（氣海）", "功能：行呼吸、行血氣、資先天", "宗氣不足：呼吸氣短、聲音低微、血行滯澀、脈弱"]}, {"id": "t041", "term": "營氣", "category": "氣血津液", "definition": "營氣行於脈中，由水谷精氣中的精專部分化生，具有營養作用和化生血液的功能。", "keyPoints": ["行於脈中，與血關係密切（營血常並稱）", "化生血液、營養周身", "營氣不足：血虛、營養障礙"]}, {"id": "t042", "term": "衛氣", "category": "氣血津液", "definition": "衛氣行於脈外，由水谷精氣中的慓悍滑利部分化生，功能是護表御邪、溫養臟腑肌膚、調節腠理開合。", "keyPoints": ["行於脈外，慓悍滑利", "防御外邪、溫養周身、調節汗孔開闔", "衛氣虛則易感冒、自汗、畏風"]}, {"id": "t043", "term": "氣機", "category": "氣血津液", "definition": "氣在體內流行運行及其升降出入的运动。氣機調暢指升降出入協調平衡；氣機失調則氣滯、氣逆、氣陷、氣閉、氣脫。", "keyPoints": ["升降出入是氣運動的基本形式", "臟腑氣機各有特點：脾升胃降、肝升肺降", "氣機失調的病機：氣滯、氣逆、氣陷、氣脫"]}, {"id": "t044", "term": "氣化", "category": "氣血津液", "definition": "通過气的運動而產生的變化，包括精、氣、血、津液之間的相互轉化及代謝產物的排出，是生命活動的基本特徵。", "keyPoints": ["氣化即物質與能量的代謝轉化", "氣化失常：水濕痰飲停聚、精血津液代謝障礙", "氣化依賴於臟腑功能，尤重脾腎"]}, {"id": "t045", "term": "血", "category": "氣血津液", "definition": "血是行於脈中、紅而黏稠的液體，由營氣和津液注入脈中化生，功能是營養和滋润全身及神志活動的物質基礎。", "keyPoints": ["血的生成：水谷精微＋腎精，奉心化赤", "血為神志活動的主要物質基礎", "血虛：面色淡白、眩暈心悸、失眠多夢、脈細"]}, {"id": "t046", "term": "氣為血之帥", "category": "氣血津液", "definition": "氣對血的生、行、攝起主導作用：氣能生血、氣能行血、氣能攝血。故治血病常配伍治氣之藥。", "keyPoints": ["氣能生血：氣虛血虛當補氣生血", "氣能行血：氣滯血瘀當行氣活血", "氣能攝血：氣不攝血當補氣攝血"]}, {"id": "t047", "term": "血為氣之母", "category": "氣血津液", "definition": "血能養氣、載氣：血為氣提供營養，氣附著於血而不逸脫。大量失血可致氣隨血脫。", "keyPoints": ["血能養氣：血足則氣旺", "血能載氣：血脫則氣無所附", "血脫者禁汗；大失血宜益氣固脫（當歸補血湯）"]}, {"id": "t048", "term": "津液", "category": "氣血津液", "definition": "機體一切正常水液的總稱，包括各臟腑組織的內在液體及正常分泌液。津質清稀，注於體表縫理，液質稠厚注骨髓腦竅。", "keyPoints": ["津：清稀， 佈散於體表肌肉縫理，滋潤", "液：稠厚，灌注骨髓腦竅關節，濡養", "津血同源：津液滲入脈中為血之組成"]}, {"id": "t049", "term": "血汗同源", "category": "氣血津液", "definition": "血與津液同源於水谷精氣且相互轉化，汗為津液所化，故失血者不可發汗，多汗者不可傷血。", "keyPoints": ["津血同源互化", "汗為心液、血之液", "臨牀禁例：奪血者無汗、汗家不可放血"]}, {"id": "t050", "term": "痰飲", "category": "氣血津液", "definition": "人體水液代謝障礙而停聚所形成的病理產物。質稠濁者為痰，質清稀者為飲。痰飲形成後又成為新的致病因素。", "keyPoints": ["「脾為生痰之源，肺為貯痰之器」", "痰無所不至：百病多由痰作祟", "飲分四飲：痰飲、懸飲、溢飲、支飲"]}, {"id": "t051", "term": "瘀血", "category": "氣血津液", "definition": "血液運行遲緩、滯留脈中，或離脈之血積存體內所形成的病理產物。瘀血既是病理產物又是致病因素。", "keyPoints": ["成因：氣虛、氣滯、寒凝、熱灼、外傷、出血", "致病特點：痛有定處、刺痛夜甚、腫塊、出血色紫暗、舌紫瘀斑、脈澀", "治則：活血化瘀，「治風先治血，血行風自滅」"]}, {"id": "t052", "term": "精", "category": "氣血津液", "definition": "精是構成人體和維持生命活動的本原精微物質，包括腎藏先天之精與受於脾胃的後天之精。", "keyPoints": ["精分先天與後天，皆藏於腎", "精主生長發育生殖，精能化氣生血", "精虧則生长发育生殖功能減退"]}, {"id": "t053", "term": "經絡", "category": "經絡", "definition": "經脈和絡脈的總稱，是人體運行氣血、聯絡臟腑肢節、溝通内外上下、傳導感應的系統。經脈為主幹縱行，絡脈為分支網狀。", "keyPoints": ["經脈：主幹，縱行，較深", "絡脈：分支，網狀，較淺", "經絡系統：經脈＋絡脈＋經別、經筋、皮部等"]}, {"id": "t054", "term": "十二經脈", "category": "經絡", "definition": "手足三陰三陽十二條經脈的總稱，是經絡系統的主體。對稱分布於左右兩側，內屬臟腑、外絡肢節。", "keyPoints": ["手三陰：肺、心包、心；手三陽：大腸、三焦、小腸", "足三陽：胃、膽、膀胱；足三陰：脾、肝、腎", "陰經行內側、陽經行外側；太陰少陰厥陰、陽明太陽少陽次序"]}, {"id": "t055", "term": "經气流注", "category": "經絡", "definition": "氣血在十二經脈中依一定順序循環流注，如環無端。流注次序起於手太陰肺經，終足厥陰肝經復注肺中。", "keyPoints": ["流注次序：肺→大腸→胃→脾→心→小腸→膀胱→腎→心包→三焦→膽→肝→肺", "陰陽表裡經之間在四肢末端交接", "同名陽經在頭面部交接，同名陰經在胸中交接"]}, {"id": "t056", "term": "奇經八脈", "category": "經絡", "definition": "十二經脈之外具有特殊分布與功能的八條經脈：督、任、沖、帶、陰維、陽維、陰蹺、陽蹺脈。不直屬臟腑，無表裡配合。", "keyPoints": ["奇經八脈：督任沖帶陰維陽維陰蹺陽蹺", "作用：密切經絡聯系、蓄積調節氣血（別儲之湖）", "「十二經氣滿，入奇經中」"]}, {"id": "t057", "term": "任脈", "category": "經絡", "definition": "行於軀幹前面正中线，總任萬脈，稱「陰脈之海」；主胞胎，與女子月經、妊娠密切相關。", "keyPoints": ["行於腹胸正中線", "「任主胞胎」：與月經、妊娠、孕育相關", "「陰脈之海」：總任諸陰經"]}, {"id": "t058", "term": "督脈", "category": "經絡", "definition": "行於軀幹後面正中线，上行頭項，入絡腦。總督萬脈，稱「陽脈之海」，與腦、脊髓、腎關係密切。", "keyPoints": ["行於背腰正中線", "「陽脈之海」：統攝全身陽經", "絡腎貫脊入腦：與神志病、脊柱病相關"]}, {"id": "t059", "term": "十五絡脈", "category": "經絡", "definition": "十五條主要絡脈的總稱：十二經各一絡，加任脈之尾翳、督脈之長強、脾之大絡。加強表裡兩經在體表的聯繫。", "keyPoints": ["十二經絡＋任督脾大絡", "自經脈分出處稱「絡穴」", "病理：表裡兩經同病"]}, {"id": "t060", "term": "十二經別", "category": "經絡", "definition": "十二經脈分出的支脈，多行於深部，加強表裡經在體內深部的聯繫，並擴大經絡循行分布範圍。", "keyPoints": ["離、合、入、出為其循行特點", "使表裡兩經在体内深部進一步聯絡", "某些經別補充了十二經脈循行未至之處"]}, {"id": "t061", "term": "經筋", "category": "經絡", "definition": "十二經脈之氣結聚於筋肉骨節的系統，主司關節運動、約束骨骼、聯屬筋肉。", "keyPoints": ["主束骨而利機關", "病則筋肉攣急、痛、關節不利", "經筋病候多表現於循行所過的筋肉關節"]}, {"id": "t062", "term": "皮部", "category": "經絡", "definition": "十二經脈及其別絡在體表的皮膚分區，是經絡系統的最外層，有抗衛外邪、反映臟腑病變的作用。", "keyPoints": ["十二皮部與十二經脈相應", "外邪入侵的途徑：皮→絡→經→腑→臟", "臨牀：皮膚針、灸法、外敷皆依據皮部理論"]}, {"id": "t063", "term": "六淫", "category": "病因", "definition": "風、寒、暑、濕、燥、火六種外感病邪的總稱。六氣異常（太過不及或非其時而有其氣）或人體正氣不足時，六氣成為致病因素稱六淫。", "keyPoints": ["六淫：風寒暑濕燥火", "致病特點：外感性、季節性、地域性、相兼性、轉化性", "六淫可單獨或相兼發病，以風邪為先導"]}, {"id": "t064", "term": "風邪", "category": "病因", "definition": "風為六淫之首、百病之長，其性開泄、善動、上行、輕揚，為陽邪。致病具有發病急、變化快、病位游走不定的特點。", "keyPoints": ["風為百病之長、陽邪", "善行而數變：病位遊走、發病迅速", "風性開泄：腠理開、汗出、惡風"]}, {"id": "t065", "term": "寒邪", "category": "病因", "definition": "寒為陰邪，其性凝滯、收引，易傷陽氣。致病多见疼痛、筋脈攣急、無汗、分泌物清冷。", "keyPoints": ["寒為陰邪，易傷陽氣", "寒性凝滯：氣血凝澀，不通則痛", "寒性收引：筋脈收縮攣急、毛竅閉塞無汗"]}, {"id": "t066", "term": "暑邪", "category": "病因", "definition": "暑為夏季主氣，純屬陽邪，其性炎上。暑性升散，易耗氣傷津；暑多挾濕。暑邪致病有明顯的季節性。", "keyPoints": ["暑為陽邪，獨見於夏季", "暑性升散：耗氣傷津，見汗多、口渴、氣短", "暑多挾濕：兼胸悶、四肢睏倦、便溏"]}, {"id": "t067", "term": "濕邪", "category": "病因", "definition": "濕為陰邪，其性重濁、黏膩、趨下，易阻滯氣機、損傷脾陽。致病病程長、症狀黏膩滯著。", "keyPoints": ["濕性重濁：頭身睏重、分泌物濁濁", "濕性黏膩：病程長、便黏、苔膩、脈濡", "濕易困脾：阻滯氣機、損傷脾陽"]}, {"id": "t068", "term": "燥邪", "category": "病因", "definition": "燥性乾澀，易傷津液，易傷肺臟。有溫燥、涼燥之分，多見口鼻乾燥、皮膚乾澀、干咳少痰。", "keyPoints": ["燥性乾澀，傷津：口鼻唇乾燥、尿少便乾", "燥易傷肺：肺為嬌臟，喜潤惡燥", "溫燥見於初秋，涼燥見於深秋"]}, {"id": "t069", "term": "火（熱）邪", "category": "病因", "definition": "火熱為陽邪，其性炎上、生風動血、易擾神明、易腐肉成膿、易傷津耗氣。", "keyPoints": ["火為陽邪，其性炎上：見高熱、面紅、目赤", "熱極生風、迫血妄行、擾及心神", "易腐血肉成瘡瘍癰腫"]}, {"id": "t070", "term": "疠氣", "category": "病因", "definition": "一類具有強烈傳染性的外感病邪，又稱疫氣、戾氣。发病急驟、病情危重、症状相似、傳染性強。", "keyPoints": ["傳染性強、流行性", "發病急、病情重、症状相似", "不受季節氣候限制，從口鼻或接觸侵入"]}, {"id": "t071", "term": "七情內傷", "category": "病因", "definition": "喜、怒、憂、思、悲、恐、驚七種情志變化異常（突然、強烈、持久）直接損傷內臟而致病，是內傷病的主要病因。", "keyPoints": ["怒則氣上、喜則氣緩、思則氣結、悲憂則氣消、恐則氣下、驚則氣亂", "直接傷臟：怒傷肝、喜傷心、思傷脾、悲憂傷肺、恐驚傷腎", "情志致病首先影響氣機"]}, {"id": "t072", "term": "飲食勞倦", "category": "病因", "definition": "飲食不節（過飽過飢、飲食不潔、偏嗜）、勞逸失度（過勞、過逸）損傷脾胃與正氣而致病。", "keyPoints": ["飲食不節先傷脾胃", "過勞：勞力傷氣、房勞傷腎、勞神傷血", "過逸：氣機不暢、脾胃功能減退、體虛發胖"]}, {"id": "t073", "term": "正治", "category": "治則治法", "definition": "逆疾病證候性質而治的法則，又稱「逆治」。寒者熱之、熱者寒之、虛則補之、實則瀉之，適用於疾病現象與本質一致者。", "keyPoints": ["「微者逆之」", "寒者熱之、熱者寒之、虛則補之、實則瀉之", "臨牀最常用治則"]}, {"id": "t074", "term": "反治", "category": "治則治法", "definition": "順從疾病假象而治的法則，又稱「從治」。熱因熱用、寒因寒用、塞因塞用、通因通用，適用於疾病出現假象者，本質仍是治病求本。", "keyPoints": ["「甚者從之」", "熱因熱用（真熱假寒）、寒因寒用（真寒假熱）", "塞因塞用（真虛假實）、通因通用（真實假虛）"]}, {"id": "t075", "term": "治標與治本", "category": "治則治法", "definition": "標本是相對概念，一般正气為本、邪氣為標，病因為本、症狀為標。急則治其標，緩則治其本，標本俱急則標本同治。", "keyPoints": ["「急則標而緩則本」", "標本俱急則標本同治", "治病求本是總原則"]}, {"id": "t076", "term": "扶正祛邪", "category": "治則治法", "definition": "扶持正氣、祛除病邪的治則。虛則補之以扶正，實則瀉之以祛邪；正虛為主扶正兼祛邪，邪盛為主祛邪兼扶正。", "keyPoints": ["扶正：益氣、養血、滋陰、溫陽", "祛邪：發汗、湧吐、攻下、清熱、活血化瘀等", "原則是「扶正而不留邪，祛邪而不傷正」"]}, {"id": "t077", "term": "調整陰陽", "category": "治則治法", "definition": "補其不足、損其有餘，使陰陽恢復平衡協調的治病總則。「陽病治陰，陰病治陽」，「壯水之主以制陽光，益火之源以消陰翳」。", "keyPoints": ["陰虛滋陰以配陽（壯水制陽光）", "陽虛補陽以配陰（益火消陰翳）", "陰陽偏盛則瀉其有餘：陽盛熱者寒之、陰盛寒者熱之"]}, {"id": "t078", "term": "三因制宜", "category": "治則治法", "definition": "因時、因地、因人制宜，根據季節氣候、地理環境、患者體質年齡性別等制定适宜治法的法則。", "keyPoints": ["因時：「用熱遠熱，用寒遠寒」", "因地：西北氣寒宜散而寒之，東南氣溫宜收而溫之", "因人：年老體虛宜補、小兒忌攻，男女異治"]}, {"id": "t079", "term": "八法", "category": "治則治法", "definition": "汗、吐、下、和、溫、清、消、補八種治法的總稱，是針對不同病證的基本治法體系。", "keyPoints": ["汗法解表、吐法湧吐、下法攻下、和法和解", "溫法祛寒、清法清熱、消法消積、補法補虛", "「汗者散其表，吐者引其高，下者導其下……」"]}, {"id": "t080", "term": "因勢利導", "category": "治則治法", "definition": "順應病勢與正氣抗邪趨向，因勢驅邪外出的治則。其高者因而越之，其下者引而竭之，在皮者汗而發之。", "keyPoints": ["「其高者，因而越之」——病位在上用吐法", "「其下者，引而竭之」——病位在下用通利二便", "「其在皮者，汗而發之」——表證用汗法"]}]}, "herbs": {"herbs": [{"id": "h001", "name": "麻黃", "category": "解表藥", "nature": "溫", "flavor": "辛、微苦", "channels": ["肺", "膀胱"], "dose": "2–10g", "efficacy": "發汗解表，宣肺平喘，利水消腫", "indications": "風寒表實證，咳嗽氣喘，風水水腫", "caution": "體虛自汗、腎上腺素類藥物使用者忌用", "memo": "發汗解表第一藥，宣肺平喘要藥"}, {"id": "h002", "name": "桂枝", " 、內守", "溫熱、上升"], "answer": 3, "explanation": "陽的屬性為運動、外向、上升、溫熱、明亮；靜止、內守、下降、寒冷、晦暗屬陰。"}, {"id": "q002", "topic": "陰陽", "stem": "「孤陰不生，獨陽不長」說明的陰陽關係是：", "options": ["陰陽消長平衡", "陰陽轉化", "陰陽對立制約", "陰陽互根互用"], "answer": 3, "explanation": "互根指陰陽各以對方為存在前提，互用指雙方相互促進資生；無根之陰陽不能生長化氣。"}, {"id": "q003", "topic": "陰陽", "stem": "「壯水之主，以制陽光」適用於何種病機？", "options": ["陰虛則熱", "陽盛則熱", "陰盛則寒", "陽虛則寒"], "answer": 0, "explanation": "陰液虧虛不能制陽而生虛熱，治當滋陰以配陽，即「陽病治陰」。"}, {"id": "q004", "topic": "陰陽", "stem": "「重陰必陽，重陽必陰」體現的陰陽關係是：", "options": ["陰陽對立", "陰陽互根", "陰陽消長", "陰陽轉化"], "answer": 3, "explanation": "消長變化達到極點發生向相反方向的轉化，是量變引起質變的過程。"}, {"id": "q005", "topic": "陰陽", "stem": "下列关于陰陽自和的敘述，正確的是：", "options": ["陰陽自和指陰陽永遠不會失調", "陰陽自和是機體自動調節恢復陰陽平衡的能力", "陰陽自和只存在於病理狀態", "陰陽自和即陰陽轉化"], "answer": 1, "explanation": "陰陽自和指機體具有自動調節陰陽趨於平衡的能力，是健康與疾病向愈的內在機制。"}, {"id": "q006", "topic": "五行", "stem": "「木曰曲直」體現的特性是：", "options": ["清涼、收斂", "溫熱、上升", "潤下、閉藏", "生長、升發、條達"], "answer": 3, "explanation": "木能屈能伸，喜條達，故以生長、升發、條達為木的特性。"}, {"id": "q007", "topic": "五行", "stem": "五行之中，具有「受納、生化、承載」特性的是：", "options": ["土", "火", "金", "水"], "answer": 0, "explanation": "土爰稼穡，有生化、承載、受納之性，故脾屬土而為後天之本。"}, {"id": "q008", "topic": "五行", "stem": "五行相剋的次序，正確的是：", "options": ["木→火→土→金→水", "木→土→水→火→金", "木→金→土→水→火", "木→水→火→金→土"], "answer": 1, "explanation": "木剋土、土剋水、水剋火、火剋金、金剋木，次序為木土水火金。"}, {"id": "q009", "topic": "五行", "stem": "「木火刑金」屬於五行病理傳變中的：", "options": ["子病犯母", "相乘", "相侮", "母病及子"], "answer": 2, "explanation": "金本剋木，肝木過旺反侮肺金，為反向克制，屬相侮（反克）。"}, {"id": "q010", "topic": "五行", "stem": "根據五行相生規律確立的治法是：", "options": ["瀉肝火以清心熱", "培土生金", "抑木扶土", "佐金平木"], "answer": 1, "explanation": "培土生金即補脾益肺，依「土生金」的相生規律而立；抑木扶土、佐金平木屬相剋規律。"}, {"id": "q011", "topic": "五行", "stem": "五臟配五行，腎屬：", "options": ["水", "木", "火", "金"], "answer": 0, "explanation": "腎主水、主藏精，有潤下閉藏之性，屬水；肝木、心火、脾土、肺金。"}, {"id": "q012", "topic": "藏象", "stem": "五臟的生理功能特點是：", "options": ["泻而不藏，實而不能滿", "亦藏亦瀉，實而能滿", "傳化水谷，實而不能滿", "藏而不瀉，滿而不能實"], "answer": 3, "explanation": "五臟主化生贮藏精氣，故「藏而不瀉」「滿而不能實」；六腑則「瀉而不藏」「實而不能滿」。"}, {"id": "q013", "topic": "藏象", "stem": "「君主之官」指哪個臟腑？", "options": ["肺", "肝", "心", "脾"], "answer": 2, "explanation": "心主血脈、主神志，為五臟六腑之大主，故稱君主之官。肺為相傅之官，肝為將軍之官。"}, {"id": "q014", "topic": "藏象", "stem": "脾主統血的生理基礎實為：", "options": ["氣能生血", "血能養氣", "血能載氣", "氣能攝血"], "answer": 3, "explanation": "脾統血即氣攝血作用具體體現，脾氣虛不能攝血則見各種慢性出血。"}, {"id": "q015", "topic": "藏象", "stem": "肝喜條達而惡抑鬱，與其何項功能關係最密切？", "options": ["肝主疏洩", "肝主筋", "肝開竅於目", "肝主藏血"], "answer": 0, "explanation": "疏洩即肝氣疏通暢達之性，條達則氣機和暢，抑鬱則肝失疏洩而病。"}, {"id": "q016", "topic": "藏象", "stem": "「先天之本」是指：", "options": ["肝", "腎", "心", "脾"], "answer": 1, "explanation": "腎藏先天之精，主生長發育生殖，為人身之本原，故稱先天之本；脾為後天之本。"}, {"id": "q017", "topic": "藏象", "stem": "肺為「水之上源」主要依據哪項功能？", "options": ["肺朝百脈", "肺主皮毛", "肺主氣司呼吸", "肺主宣發肅降、通調水道"], "answer": 3, "explanation": "肺氣宣發肅降推動水液運行與下輸膀胱，位置最高故稱水之上源。"}, {"id": "q018", "topic": "藏象", "stem": "胃的生理特性是：", "options": ["主升為順", "以通降為和", "體陰用陽", "喜燥惡濕"], "answer": 1, "explanation": "胃氣主降，降則和、降則通；脾喜燥惡濕、以升為順；體陰用陽屬肝。"}, {"id": "q019", "topic": "氣血津液", "stem": "根於腎、以三焦為通道流行全身的是：", "options": ["衛氣", "元氣", "宗氣", "營氣"], "answer": 1, "explanation": "元氣由腎中先天之精化生，經三焦通道流行全身，為人體生命活動原動力。"}, {"id": "q020", "topic": "氣血津液", "stem": "行於脈外、功能護表御邪的氣是：", "options": ["營氣", "衛氣", "宗氣", "元氣"], "answer": 1, "explanation": "衛氣慓悍滑利行脈外，溫分肉、肥腠理、司開闔、御外邪；營氣行脈中主營養。"}, {"id": "q021", "topic": "氣血津液", "stem": "「奪血者無汗，汗家不可放血」的理論依據是：", "options": ["血汗同源", "氣能攝血", "津能載氣", "氣能生血"], "answer": 0, "explanation": "血與津液同源互化，汗為津液所化，失血者發汗、多汗者動血皆重傷其陰液。"}, {"id": "q022", "topic": "氣血津液", "stem": "瘀血致病的特點，下列何者錯誤？", "options": ["腫塊固定不移", "疼痛游走不定", "舌質紫暗或有瘀斑", "痛有定處、刺痛夜甚"], "answer": 1, "explanation": "遊走性疼痛屬風邪（行痹）；瘀血疼痛特點為固定、刺痛、夜甚。"}, {"id": "q023", "topic": "氣血津液", "stem": "「脾為生痰之源」的機理是：", "options": ["脾主統血失職", "脾氣不升反下陷", "脾陰不足生虛熱", "脾主運化水液失職，水濕停聚成痰"], "answer": 3, "explanation": "脾失健運則水液停滯，濕聚為飲、凝結為痰，故治痰當健脾燥濕以絕其源。"}, {"id": "q024", "topic": "氣血津液", "stem": "宗氣的功能是：", "options": ["營養全身、化生血液", "護表御邪、調節腠理", "走息道行呼吸、貫心脈行氣血", "推動生長發育"], "answer": 2, "explanation": "宗氣積於胸中氣海，出喉咙司呼吸、貫心脈行氣血、並資先天元氣。"}, {"id": "q025", "topic": "經絡", "stem": "十二經脈氣血流注的起始經是：", "options": ["任脈", "手陽明大腸經", "足厥陰肝經", "手太陰肺經"], "answer": 3, "explanation": "流注起於手太陰肺經，傳足厥陰肝經後復注肺中，如環無端。"}, {"id": "q026", "topic": "經絡", "stem": "「陰脈之海」是指：", "options": ["沖脈", "帶脈", "督脈", "任脈"], "answer": 3, "explanation": "任脈行於身前正中线，總任諸陰經，故稱陰脈之海；督脈為陽脈之海。"}, {"id": "q027", "topic": "經絡", "stem": "十二經脈在四肢的分布規律，正確的是：", "options": ["陰經行內側，陽經行外側", "陰陽經皆行前方", "太陰在前、厥陰在中、少陰在後（內踝上八寸以下）", "陽經行內側，陰經行外側"], "answer": 0, "explanation": "陰經行於四肢內側、陽經行於外側；內踝上八寸以下，厥陰在前、太陰在中。"}, {"id": "q028", "topic": "經絡", "stem": "奇經八脈中「約束縱脈」的是：", "options": ["陰蹺脈", "沖脈", "陽維脈", "帶脈"], "answer": 3, "explanation": "帶脈環腰一周，約束縱行諸經脈，故稱「帶脈為病，諸脈皆緩」。"}, {"id": "q029", "topic": "經絡", "stem": "十二經別主要的循行特點是：", "options": ["離、合、入、出", "如環無端首尾相接", "只行於體表", "屬臟絡腑不離本經"], "answer": 0, "explanation": "經別從本經分出（離）、入胸腹臟腑（入）、出頸項（出）、與表裡經相合（合）。"}, {"id": "q030", "topic": "病因", "stem": "「百病之長」、常為外感病先導的邪氣是：", "options": ["風邪", "濕邪", "燥邪", "寒邪"], "answer": 0, "explanation": "風為六淫之首，善行數變、輕揚開泄，寒濕燥熱常依附於風侵犯人體。"}, {"id": "q031", "topic": "病因", "stem": "「寒性收引」在臨床上最能表現為：", "options": ["頭身睏重", "筋脈攣急、屈伸不利", "口渴喜飲", "痰多黏稠"], "answer": 1, "explanation": "收引即收縮牽引，寒客筋脈經絡則收縮攣急、疼痛拘緊。"}, {"id": "q032", "topic": "病因", "stem": "「濕性黏膩」的臨床表現是：", "options": ["高熱大汗大渴", "疼痛如刺、入夜尤甚", "大便黏滯不暢、舌苔膩", "病位遊走不定"], "answer": 2, "explanation": "黏膩指症状黏著滯重（便黏、苔膩）及病程纏綿難愈。"}, {"id": "q033", "topic": "病因", "stem": "「怒則氣上」說明七情致病的特點是：", "options": ["必由口鼻而入", "直接損傷臟腑", "首先影響氣機", "多傷心腎"], "answer": 2, "explanation": "七情內傷先擾氣機：怒則氣上、喜則氣緩、思則氣結、恐則氣下等，進而損傷臟腑。"}, {"id": "q034", "topic": "病因", "stem": "暑邪致病與他邪不同的特點是：", "options": ["屬陽邪", "可與濕相兼", "只在夏季發病", "易傷津液"], "answer": 2, "explanation": "暑為夏季主氣，純屬外感且季節性最強；傷津、陽邪、挾濕他邪亦可見。"}, {"id": "q035", "topic": "病因", "stem": "燥邪致病最易損傷：", "options": ["肝", "心", "肺", "腎"], "answer": 2, "explanation": "肺為嬌臟、喜潤惡燥，開竅於鼻外合皮毛，燥邪自口鼻而入最易傷肺。"}, {"id": "q036", "topic": "治則治法", "stem": "「寒因寒用」屬於：", "options": ["反治", "治本", "因勢利導", "正治"], "answer": 0, "explanation": "以寒治寒順從假象（真熱假寒），屬反治（從治），實為熱者寒之的變格。"}, {"id": "q037", "topic": "治則治法", "stem": "「塞因塞用」適用於：", "options": ["寒凝腹痛", "熱結旁流", "真實便秘", "真虛膨閉（脾虛腹滿）"], "answer": 3, "explanation": "以補開塞，用於至虛之證反見閉塞假象者，如脾虚腹滿當健脾以除脹。"}, {"id": "q038", "topic": "治則治法", "stem": "「急則治其標」適用於下列何種情況？", "options": ["大出血危急之候", "陰虛發熱", "食積腹脹", "慢性病調理"], "answer": 0, "explanation": "標本俱急或標證危急時（大出血、劇痛、二便不通），先救其急以治標。"}, {"id": "q039", "topic": "治則治法", "stem": "八法中「消法」的適應範圍是：", "options": ["陽虛寒證", "表證", "食積、痞塊、痰核等有形之積", "實熱燥屎內結"], "answer": 2, "explanation": "消法漸消漸散，適於氣、血、痰、食、水、蟲等漸積有形之證；燥屎內結當攻下。"}, {"id": "q040", "topic": "治則治法", "stem": "「用熱遠熱，用寒遠寒」體現的治則是：", "options": ["治病求本", "因時制宜", "因地制宜", "因人制宜"], "answer": 1, "explanation": "暑天慎用熱藥、寒冬慎用寒藥，屬三因制宜中的因時制宜。"}]}, "meta": {"app": "中醫自學", "counts": {"theory": 80, "herbs": 100, "formulas": 60, "meridians": 14, "points": 128, "quiz": 40}}}

    <script>
      const D = window.TCM_DATA;
      const LS = "tcm.";
      function get(k) {
        try {
          return JSON.parse(localStorage.getItem(LS + k));
        } catch {
          return null;
        }
      }
      function set(k, v) {
        localStorage.setItem(LS + k, JSON.stringify(v));
      }
      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // Tab switching
      function activateTab(name) {
        document
          .querySelectorAll(".tab-bar button")
          .forEach((b) => b.classList.toggle("active", b.dataset.tab === name));
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById("page-" + name).classList.add("active");
      }
      document.querySelectorAll(".tab-bar button").forEach((btn) => {
        btn.addEventListener("click", () => activateTab(btn.dataset.tab));
      });

      // === MODULE 1: 學習路徑 ===
      function renderPath() {
        const el = document.getElementById("path-content");
        const prog = get("path_progress") || {};
        let html = "";
        D.curriculum.stages.forEach((s) => {
          const done = prog[s.id] || [];
          const pct = s.tasks.length
            ? Math.round((done.length / s.tasks.length) * 100)
            : 0;
          html += `<div class="stage-card card">
<h2>${s.title}</h2>
<p class="text-muted text-sm">${s.goal}</p>
<p class="text-sm" style="margin:4px 0">${s.duration}</p>
<div class="progress-bar"><div style="width:${pct}%"></div></div>
<p class="text-sm text-muted">${done.length}/${s.tasks.length} 完成</p>
<div class="mt">`;
          s.tasks.forEach((t, i) => {
            const checked = done.includes(i) ? "checked" : "";
            const filter = t.filter || "";
            html += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0">
<label style="flex:1;cursor:pointer"><input type="checkbox" ${checked} data-stage="${s.id}" data-idx="${i}"> ${t.label}</label>
<button class="btn btn-sm btn-outline task-go" data-module="${t.module}" data-filter="${filter}">開啟 ▸</button>
</div>`;
          });
          html += `</div><p class="text-sm mt" style="color:var(--green)">里程碑：${s.milestone}</p></div>`;
        });
        el.innerHTML = html;
      }
      // Delegated once: checkbox progress + task deep-links (survives innerHTML re-render).
      function wirePath() {
        const el = document.getElementById("path-content");
        el.addEventListener("change", (e) => {
          if (!e.target.matches("input[type=checkbox]")) return;
          const sid = e.target.dataset.stage,
            idx = parseInt(e.target.dataset.idx);
          const p = get("path_progress") || {};
          if (!p[sid]) p[sid] = [];
          if (e.target.checked) {
            if (!p[sid].includes(idx)) p[sid].push(idx);
          } else {
            p[sid] = p[sid].filter((x) => x !== idx);
          }
          set("path_progress", p);
          renderPath();
        });
        el.addEventListener("click", (e) => {
          const b = e.target.closest(".task-go");
          if (b) openModule(b.dataset.module, b.dataset.filter);
        });
      }

      function cardTypeIndex(key) {
        return cardTypes.findIndex((t) => t.key === key);
      }
      function catForType(typeKey, filter) {
        if (!filter) return "all";
        const cats = cardTypes[cardTypeIndex(typeKey)]
          .items()
          .map((x) => x.cat);
        let want = filter;
        if (typeKey === "acupoints") {
          const m = D.acupoints.meridians.find((x) => x.id === filter);
          if (m) want = m.short;
        }
        return cats.includes(want) ? want : "all";
      }
      function openModule(module, filter) {
        if (module === "quiz") {
          activateTab("quiz");
          return;
        }
        const ti = cardTypeIndex(module);
        if (ti < 0) {
          activateTab("cards");
          return;
        }
        cardState.typeIdx = ti;
        cardState.catFilter = catForType(module, filter);
        renderCardControls();
        initDeck();
        renderCard();
        activateTab("cards");
      }

      // === MODULE 2: 卡片記憶 ===
      const cardTypes = [
        {
          key: "theory",
          label: "基礎理論",
          items: () =>
            D.theory.concepts.map((c) => ({
              id: c.id,
              front: c.term,
              back: `<dt>定義</dt><dd>${c.definition}</dd><dt>要點</dt><dd>${c.keyPoints.join("；")}</dd>`,
              cat: c.category,
            })),
        },
        {
          key: "herbs",
          label: "中藥",
          items: () =>
            D.herbs.herbs.map((h) => ({
              id: h.id,
              front: h.name,
              back: `<dt>性味歸經</dt><dd>${h.nature}，${h.flavor}，入${h.channels.join("、")}</dd><dt>功效</dt><dd>${h.efficacy}</dd><dt>主治</dt><dd>${h.indications}</dd><dt>用量</dt><dd>${h.dose}</dd><dt>注意</dt><dd>${h.caution || "無"}</dd><dt>口訣</dt><dd>${h.memo}</dd>`,
              cat: h.category,
            })),
        },
        {
          key: "formulas",
          label: "方劑",
          items: () =>
            D.formulas.formulas.map((f) => ({
              id: f.id,
              front: f.name,
              back: `<dt>組成</dt><dd>${f.composition.map((c) => c.herb + "(" + c.role + ")").join("、")}</dd><dt>功用</dt><dd>${f.function}</dd><dt>主治</dt><dd>${f.indications}</dd><dt>方解</dt><dd>${f.analysis}</dd><dt>方歌</dt><dd>${f.song}</dd>`,
              cat: f.category,
            })),
        },
        {
          key: "acupoints",
          label: "經絡穴位",
          items: () =>
            D.acupoints.points.map((p) => {
              const m = D.acupoints.meridians.find((x) => x.id === p.meridian);
              return {
                id: p.id,
                front: p.name + " (" + (m ? m.short : "") + ")",
                back: `<dt>歸經</dt><dd>${m ? m.name : p.meridian}</dd><dt>定位</dt><dd>${p.location}</dd><dt>主治</dt><dd>${p.indications}</dd><dt>刺法</dt><dd>${p.method}</dd>${p.special ? "<dt>特異</dt><dd>" + p.special + "</dd>" : ""}`,
                cat: m ? m.short : "其他",
              };
            }),
        },
      ];
      let cardState = {
        typeIdx: 0,
        cats: [],
        catFilter: "all",
        deck: [],
        idx: 0,
        flipped: false,
        known: 0,
        unknown: 0,
      };

      function renderCardControls() {
        const el = document.getElementById("card-controls");
        let html = '<div class="flex flex-wrap mb">';
        cardTypes.forEach((t, i) => {
          html += `<button class="btn btn-sm ${i === cardState.typeIdx ? "" : "btn-outline"}" data-ct="${i}">${t.label}</button>`;
        });
        html += "</div>";
        const allCats = [
          ...new Set(cardTypes[cardState.typeIdx].items().map((x) => x.cat)),
        ];
        html += '<div class="flex flex-wrap mb">';
        html += `<button class="btn btn-sm ${cardState.catFilter === "all" ? "" : "btn-outline"}" data-cf="all">全部</button>`;
        allCats.forEach((c) => {
          html += `<button class="btn btn-sm ${cardState.catFilter === c ? "" : "btn-outline"}" data-cf="${c}">${c}</button>`;
        });
        html += "</div>";
        el.innerHTML = html;
        el.querySelectorAll("[data-ct]").forEach((b) =>
          b.addEventListener("click", () => {
            cardState.typeIdx = parseInt(b.dataset.ct);
            cardState.catFilter = "all";
            initDeck();
            renderCardControls();
            renderCard();
          }),
        );
        el.querySelectorAll("[data-cf]").forEach((b) =>
          b.addEventListener("click", () => {
            cardState.catFilter = b.dataset.cf;
            initDeck();
            renderCardControls();
            renderCard();
          }),
        );
      }
      function initDeck() {
        let items = cardTypes[cardState.typeIdx].items();
        if (cardState.catFilter !== "all")
          items = items.filter((x) => x.cat === cardState.catFilter);
        cardState.deck = shuffle(items);
        cardState.idx = 0;
        cardState.flipped = false;
        cardState.known = 0;
        cardState.unknown = 0;
      }
      function renderCard() {
        const el = document.getElementById("card-area");
        if (!cardState.deck.length) {
          el.innerHTML = '<p class="text-muted">無資料</p>';
          return;
        }
        if (cardState.idx >= cardState.deck.length) {
          el.innerHTML = `<div class="card text-center"><h2>本組完成</h2><p class="mt">記得：${cardState.known} 不記得：${cardState.unknown}</p><button class="btn mt" id="card-restart">重新開始</button></div>`;
          document.getElementById("card-restart").onclick = () => {
            initDeck();
            renderCard();
          };
          return;
        }
        const c = cardState.deck[cardState.idx];
        const progress = `${cardState.idx + 1}/${cardState.deck.length}`;
        let html = `<p class="text-muted text-sm text-center mb">${progress}</p>`;
        html += `<div class="flashcard" id="fc"><div class="front">${c.front}</div>`;
        if (cardState.flipped) html += `<div class="back">${c.back}</div>`;
        html += `</div>`;
        if (cardState.flipped) {
          html += `<div class="nav-controls"><button class="btn btn-outline" id="fc-no">不記得</button><button class="btn btn-green" id="fc-yes">記得</button></div>`;
        } else {
          html += `<div class="nav-controls"><button class="btn btn-outline" id="fc-flip">翻面</button><button class="btn" id="fc-next">下一張 →</button></div>`;
        }
        el.innerHTML = html;
        const fc = document.getElementById("fc");
        if (!cardState.flipped) {
          document.getElementById("fc-flip").onclick = () => {
            cardState.flipped = true;
            renderCard();
          };
          document.getElementById("fc-next").onclick = () => {
            cardState.idx++;
            cardState.flipped = false;
            renderCard();
          };
          fc.onclick = () => {
            cardState.flipped = true;
            renderCard();
          };
        } else {
          document.getElementById("fc-no").onclick = () => {
            cardState.unknown++;
            cardState.idx++;
            cardState.flipped = false;
            renderCard();
          };
          document.getElementById("fc-yes").onclick = () => {
            cardState.known++;
            cardState.idx++;
            cardState.flipped = false;
            renderCard();
          };
        }
      }

      // === MODULE 3: 查詢工具書 ===
      function renderRef() {
        const el = document.getElementById("ref-content");
        el.innerHTML = `<input type="text" id="ref-search" placeholder="搜尋藥名、方名、穴名、功效...">
<div class="flex flex-wrap mb"><button class="btn btn-sm ref-filter" data-type="all">全部</button><button class="btn btn-sm btn-outline ref-filter" data-type="theory">理論</button><button class="btn btn-sm btn-outline ref-filter" data-type="herbs">中藥</button><button class="btn btn-sm btn-outline ref-filter" data-type="formulas">方劑</button><button class="btn btn-sm btn-outline ref-filter" data-type="acupoints">穴位</button></div>
<div class="search-results" id="ref-results"></div>`;
        const searchInput = document.getElementById("ref-search");
        const results = document.getElementById("ref-results");
        let filterType = "all";
        el.querySelectorAll(".ref-filter").forEach((b) =>
          b.addEventListener("click", () => {
            filterType = b.dataset.type;
            el.querySelectorAll(".ref-filter").forEach((x) =>
              x.classList.add("btn-outline"),
            );
            b.classList.remove("btn-outline");
            doSearch();
          }),
        );
        searchInput.addEventListener("input", doSearch);
        function doSearch() {
          const q = searchInput.value.trim().toLowerCase();
          let items = [];
          if (filterType === "all" || filterType === "theory") {
            D.theory.concepts.forEach((c) => {
              if (
                !q ||
                c.term.includes(q) ||
                c.definition.includes(q) ||
                c.category.includes(q)
              )
                items.push({
                  type: "theory",
                  name: c.term,
                  cat: c.category,
                  desc: c.definition,
                });
            });
          }
          if (filterType === "all" || filterType === "herbs") {
            D.herbs.herbs.forEach((h) => {
              if (
                !q ||
                h.name.includes(q) ||
                h.efficacy.includes(q) ||
                h.indications.includes(q) ||
                h.category.includes(q)
              )
                items.push({
                  type: "herb",
                  name: h.name,
                  cat: h.category,
                  desc: h.efficacy,
                });
            });
          }
          if (filterType === "all" || filterType === "formulas") {
            D.formulas.formulas.forEach((f) => {
              if (
                !q ||
                f.name.includes(q) ||
                f.function.includes(q) ||
                f.indications.includes(q) ||
                f.category.includes(q)
              )
                items.push({
                  type: "formula",
                  name: f.name,
                  cat: f.category,
                  desc: f.function,
                });
            });
          }
          if (filterType === "all" || filterType === "acupoints") {
            D.acupoints.points.forEach((p) => {
              const m = D.acupoints.meridians.find((x) => x.id === p.meridian);
              const mname = m ? m.name : "";
              if (
                !q ||
                p.name.includes(q) ||
                p.indications.includes(q) ||
                mname.includes(q)
              )
                items.push({
                  type: "point",
                  name: p.name,
                  cat: mname,
                  desc: p.indications,
                });
            });
          }
          if (!q && filterType === "all") {
            results.innerHTML = `<p class="text-muted" style="text-align:center;padding:40px 0">輸入關鍵字搜尋，或点击上方分類篩選</p>`;
            return;
          }
          const total = items.length;
          if (items.length > 200) items = items.slice(0, 200);
          let html = `<p class="text-sm text-muted mb">${total} 條結果${
            total > items.length ? "（僅顯示前 200 筆）" : ""
          }</p>`;
          items.forEach((it) => {
            html += `<div class="card"><strong>${it.name}</strong> <span class="badge">${it.cat}</span><p class="text-sm text-muted">${it.desc}</p></div>`;
          });
          results.innerHTML = html;
        }
        doSearch();
      }

      // === MODULE 4: 測驗考試 ===
      function renderQuizSetup() {
        const el = document.getElementById("quiz-content");
        el.innerHTML = `<div class="card"><h3>選擇範圍</h3>
<select id="qz-scope">
<option value="all">全部題目（手動+自動）</option>
<option value="manual">手動理論題</option>
<option value="herbs">自動生成：中藥</option>
<option value="formulas">自動生成：方劑</option>
<option value="acupoints">自動生成：穴位</option>
<option value="theory">自動生成：理論</option>
</select>
<label class="text-sm text-muted">題數</label>
<select id="qz-count"><option value="10">10</option><option value="20">20</option><option value="30">30</option></select>
<button class="btn mt" id="qz-start">開始測驗</button></div>`;
        document.getElementById("qz-start").onclick = () => {
          const scope = document.getElementById("qz-scope").value;
          const count = parseInt(document.getElementById("qz-count").value);
          startQuiz(scope, count);
        };
      }

      function autoQuestions(items, cfg) {
        const texts = cfg.textList;
        return items.map((it) => {
          const correct = cfg.answerText(it);
          const distractors = shuffle([
            ...new Set(texts.filter((t) => t !== correct)),
          ]).slice(0, 3);
          const options = shuffle([correct, ...distractors]);
          return {
            id: "auto_" + cfg.prefix + "_" + it.id,
            stem: cfg.stem(it),
            options,
            answer: options.indexOf(correct),
            explanation: cfg.explain(it),
          };
        });
      }

      function generateAutoQuestions(scope) {
        let qs = [];
        if (scope === "all" || scope === "herbs")
          qs = qs.concat(
            autoQuestions(D.herbs.herbs, {
              prefix: "h",
              stem: (h) => `${h.name} 的功效是？`,
              answerText: (h) => h.efficacy,
              explain: (h) => `${h.name}：${h.efficacy}`,
              textList: D.herbs.herbs.map((x) => x.efficacy),
            }),
          );
        if (scope === "all" || scope === "formulas")
          qs = qs.concat(
            autoQuestions(D.formulas.formulas, {
              prefix: "f",
              stem: (f) => `${f.name} 的功用是？`,
              answerText: (f) => f.function,
              explain: (f) => `${f.name}：${f.function}`,
              textList: D.formulas.formulas.map((x) => x.function),
            }),
          );
        if (scope === "all" || scope === "acupoints")
          qs = qs.concat(
            autoQuestions(D.acupoints.points, {
              prefix: "a",
              stem: (p) => `${p.name} 的定位是？`,
              answerText: (p) => p.location,
              explain: (p) => `${p.name}：${p.location}`,
              textList: D.acupoints.points.map((x) => x.location),
            }),
          );
        if (scope === "all" || scope === "theory")
          qs = qs.concat(
            autoQuestions(D.theory.concepts, {
              prefix: "t",
              stem: (c) => `${c.term} 的定義是？`,
              answerText: (c) => c.definition,
              explain: (c) => `${c.term}：${c.definition}`,
              textList: D.theory.concepts.map((x) => x.definition),
            }),
          );
        return qs;
      }

      function buildQuizSet(scope, count) {
        let pool = [];
        if (scope === "all" || scope === "manual")
          pool = pool.concat(
            D.quiz.questions.map((q) => ({ ...q, _source: "manual" })),
          );
        if (
          scope === "all" ||
          scope === "herbs" ||
          scope === "formulas" ||
          scope === "acupoints" ||
          scope === "theory"
        )
          pool = pool.concat(generateAutoQuestions(scope));
        return shuffle(pool).slice(0, count);
      }

      function startQuiz(scope, count) {
        const questions = buildQuizSet(scope, count);
        let idx = 0,
          score = 0,
          wrongList = [];
        function render() {
          const el = document.getElementById("quiz-content");
          if (idx >= questions.length) {
            let pct = questions.length
              ? Math.round((score / questions.length) * 100)
              : 0;
            let html = `<div class="card text-center"><h2>測驗結束</h2><p style="font-size:32px;color:${pct >= 60 ? "var(--green)" : "var(--accent)"}">${pct}%</p><p>${score}/${questions.length} 正確</p>`;
            if (wrongList.length) {
              html += '<h3 class="mt">錯題回顧</h3>';
              wrongList.forEach((w) => {
                html += `<div class="card"><p class="text-sm"><strong>${w.stem}</strong></p><p class="text-sm" style="color:var(--green)">正確：${w.correct}</p><p class="text-sm" style="color:var(--accent)">你選：${w.picked}</p>${w.explanation ? `<p class="text-sm text-muted">解析：${w.explanation}</p>` : ""}</div>`;
              });
            }
            html += '<button class="btn mt" id="qz-back">返回</button></div>';
            el.innerHTML = html;
            document.getElementById("qz-back").onclick = renderQuizSetup;
            return;
          }
          const q = questions[idx];
          // shuffle options while tracking which shuffled slot holds the answer
          const optIndices = shuffle([0, 1, 2, 3]);
          const shuffled = optIndices.map((i) => q.options[i]);
          const correctIdx = optIndices.indexOf(q.answer);

          let html = `<div class="card"><p class="text-sm text-muted">${idx + 1}/${questions.length}</p><p class="mb" style="font-size:16px">${q.stem}</p>`;
          shuffled.forEach((opt, i) => {
            html += `<button class="quiz-option" data-oi="${i}">${"ABCD"[i]}. ${opt}</button>`;
          });
          html += `<div id="qz-explain" style="display:none" class="mt"></div><div id="qz-nav" style="display:none" class="mt text-center"><button class="btn" id="qz-next">下一題 →</button></div></div>`;
          el.innerHTML = html;
          el.querySelectorAll(".quiz-option").forEach((btn) => {
            btn.addEventListener("click", () => {
              // correctIdx comes from the render() closure, never from the DOM
              const sel = parseInt(btn.dataset.oi);
              const ci = correctIdx;
              el.querySelectorAll(".quiz-option").forEach((b, i) => {
                b.disabled = true;
                if (i === ci) b.classList.add("correct");
                if (i === sel && sel !== ci) b.classList.add("wrong");
              });
              if (sel === ci) score++;
              else
                wrongList.push({
                  stem: q.stem,
                  correct: shuffled[ci],
                  picked: shuffled[sel],
                  explanation: q.explanation,
                });
              const exp = document.getElementById("qz-explain");
              if (q.explanation)
                exp.innerHTML = `<p class="text-sm text-muted">解析：${q.explanation}</p>`;
              exp.style.display = "block";
              document.getElementById("qz-nav").style.display = "block";
              document.getElementById("qz-next").onclick = () => {
                idx++;
                render();
              };
            });
          });
        }
        render();
      }

      // Init
      renderPath();
      wirePath();
      renderCardControls();
      initDeck();
      renderCard();
      renderRef();
      renderQuizSetup();
    </script>
  </body>
</html>
